name: mole-intel

# The web app and the 11pm desk. Ollama is not in this file.
# It is already running at 192.168.86.35:11434. Host network reaches that LAN address.
# Do not add a ports: block with host network.
services:
  web:
    build: .
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      TZ: America/Toronto
      MOLE_DATA: /data
      PYTHON: /opt/yf/bin/python
      LLM_BASE_URL: http://192.168.86.35:11434/v1
      LLM_MODEL: qwen3.5:9b
      LLM_CONTEXT: "65536"
      SEARXNG_URL: http://192.168.86.35:8099
      FRED_API_KEY: ${FRED_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  desk:
    build: .
    network_mode: host
    command: ["bash", "/app/scripts/desk.sh"]
    environment:
      TZ: America/Toronto
      MOLE_DATA: /data
      PYTHON: /opt/yf/bin/python
      LLM_BASE_URL: http://192.168.86.35:11434/v1
      LLM_MODEL: qwen3.5:9b
      LLM_CONTEXT: "65536"
      SEARXNG_URL: http://192.168.86.35:8099
      FRED_API_KEY: ${FRED_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
