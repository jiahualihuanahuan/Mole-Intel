name: mole-intel

services:
  mole-intel:
    build: .
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      MOLE_DATA: /data
      LLM_BASE_URL: http://host.docker.internal:8000/v1
      LLM_MODEL: qwen2.5-7b
      SEARXNG_URL: http://host.docker.internal:8099
      FRED_API_KEY: ${FRED_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - ${HOME}/Mole-Intel-Debate/data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
