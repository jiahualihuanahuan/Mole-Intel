name: mole-intel

services:
  mole-intel:
    build: .
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      OLLAMA_BASE_URL: http://192.168.86.35:11434/v1
      MOLE_DATA: /app/data
    volumes:
      - mole-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mole-data:
